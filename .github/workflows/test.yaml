name: test

on: push

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Fortran
      uses: awvwgk/setup-fortran@main
      id: setup-fortran
      with:
        compiler: gcc
        version: 13

    - uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: test-env
        create-args: >-
          python 
          numpy 
          scikit-build 
          cmake=3 
          ninja 
          cython 
          fypp 
          pip 
          c-compiler 
          cxx-compiler 
          fortran-compiler

    - name: Install Valgrind
      run: |
        sudo apt install valgrind

    - name: configure cmake
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_PREFIX_PATH=$CONDA_PREFIX

    - name: build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: test
      working-directory: ${{github.workspace}}/build
      run: |
        valgrind --error-exitcode=1 --leak-check=full ./test/test_equilibrate

    - name: build python
      run: |
        export CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
        python -m pip install --no-deps --no-build-isolation . -v

    - name: test python
      working-directory: ${{github.workspace}}/test
      run: python test_equilibrate.py